<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 100 100">
  <!-- Outline = the solid silhouette with an inset copy knocked out of it, so
       the whole glyph stays a single alpha mask and macOS can tint it. -->
  <mask id="om">
    <g fill="#fff" stroke="#fff" stroke-linecap="round">
      <line x1="27" y1="20" x2="41" y2="52" stroke-width="16"/>
      <line x1="65" y1="18" x2="54" y2="52" stroke-width="16"/>
      <rect x="55" y="48" width="25" height="30" rx="12" stroke="none"/>
      <rect x="24" y="47" width="52" height="33" rx="15" stroke="none"/>
      <line x1="26" y1="61" x2="48" y2="71" stroke-width="18"/>
      <rect x="37" y="70" width="28" height="26" rx="9" stroke="none"/>
    </g>
    <g fill="#000" stroke="#000" stroke-linecap="round">
      <line x1="27" y1="22" x2="41" y2="50" stroke-width="9"/>
      <line x1="65" y1="20" x2="54" y2="50" stroke-width="9"/>
      <rect x="58.5" y="51.5" width="18" height="23" rx="9" stroke="none"/>
      <rect x="27.5" y="50.5" width="45" height="26" rx="12" stroke="none"/>
      <line x1="28" y1="61" x2="46" y2="69" stroke-width="11"/>
      <rect x="40.5" y="70" width="21" height="26" rx="6" stroke="none"/>
    </g>
  </mask>
  <rect width="100" height="100" fill="#000" mask="url(#om)"/>
</svg>
