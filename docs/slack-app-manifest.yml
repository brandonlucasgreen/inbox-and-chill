# Inbox & Chill — Slack app manifest
#
# Create the app: https://api.slack.com/apps → "Create New App" →
# "From an app manifest" → pick the Buffer workspace → paste this file.
# Then: Install to Workspace (this may trigger an admin approval request).
#
# After install, collect the token(s) for the app's Slack source settings:
#   1. User OAuth Token (xoxp-…): OAuth & Permissions page, under "OAuth
#      Tokens for Your Workspace". REQUIRED.
#      NOT the "xoxe.xoxp-" App Configuration Token offered on the apps
#      list — that one drives the Manifest API only and dies after 12 hours.
#   2. App-Level Token (xapp-…): Basic Information → App-Level Tokens →
#      Generate, with scope connections:write. OPTIONAL — it turns on Socket
#      Mode, which is the only supported way to receive channel mentions.
#      Without it you still get DM unreads, emoji saves and read-state
#      auto-clear by polling.
#
# This app is INTERNAL to the workspace (never distributed). That is not a
# shortcut, it is forced:
#   - Socket Mode apps are barred from the Slack Marketplace, so a single
#     universal listed app could not use Socket Mode at all.
#   - Slack's May-2025 rate limits throttle conversations.history to 1 req/min
#     for non-Marketplace *distributed* apps, but exempt internal
#     customer-built apps — which is what this manifest creates.
#   - A universal app would need OAuth, and oauth.v2.access requires the
#     client secret (Slack has no PKCE public-client mode) with HTTPS-only
#     redirect URLs. A native Mac app can hold neither, so that would require
#     a hosted relay.
# Hence: each user creates their own app from this manifest.
display_information:
  name: Inbox and Chill
  description: "Surfaces my own mentions, unread DMs and emoji-saved messages in a private menu bar app. Acts only on my own account."
  background_color: "#2b2d31"
oauth_config:
  scopes:
    user:
      - channels:read      # list channels I'm in, read last_read
      - channels:history   # detect @-mentions in channel messages
      - groups:read        # same for private channels
      - groups:history
      - im:read            # unread counts for DMs
      - im:history
      - mpim:read          # group DMs
      - mpim:history
      - users:read         # display names for DM titles
      - reactions:read     # emoji-save gesture (reaction events)
      - reactions:write    # un-save = remove my own reaction
      - search:read        # Keyword Watch: the ONLY way to see a message in a
                           # public channel I'm not a member of. Events are
                           # scoped to my memberships, so a mention (or any
                           # keyword) in a room I'm not in is invisible to
                           # message.channels — and Slack doesn't notify me
                           # about it either. Optional: leave the scope off and
                           # everything else still works, you just can't use
                           # the Keyword Watch field.
settings:
  event_subscriptions:
    user_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
      # NOTE: no im_marked / channel_marked / group_marked / mpim_marked here.
      # Those are RTM-era and are not valid Events API user event types —
      # Slack's manifest validator rejects them outright. Read-state ("you
      # read it in Slack, it clears here") is handled by polling
      # conversations.info instead; see the "Read-state without *_marked"
      # note in Sources/App/Connectors/Slack/SlackConnector.swift.
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
