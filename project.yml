name: InboxAndChill
options:
  bundleIdPrefix: lol.bgreen
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  # In-app updates. Sparkle ships as a binary XCFramework, so SPM embeds and
  # Xcode re-signs it with our Developer ID — see the nested-code preflight in
  # scripts/notarize.sh, which exists because that re-signing is the one part
  # notarization cares about and the one part no build failure would reveal.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Real Developer ID signing, not ad-hoc ("-"), even for local builds.
    # macOS keys Keychain ACLs, TCC permissions, and firewall decisions to
    # the code signature: an ad-hoc signature has no stable identity, so
    # every rebuild looks like a brand-new app and re-prompts for all of
    # them. Developer ID is also what the eventual release ships with
    # (PLAN §2.1.7), so local testing exercises the real artifact.
    #
    # Building this yourself? Change DEVELOPMENT_TEAM to your own Team ID,
    # or pass CODE_SIGN_IDENTITY="-" to xcodebuild for an unsigned build.
    DEVELOPMENT_TEAM: CV926C8KS8
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
  configs:
    Release:
      # Xcode otherwise injects `com.apple.security.get-task-allow` — the
      # entitlement that lets a debugger attach to the process. It is correct
      # for Debug and wrong for anything shipped: it weakens the hardened
      # runtime, and notarization rejects a Developer ID binary that carries
      # it. Scoped to Release so debugging a Debug build still works.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      # Xcode signs local builds with `--timestamp=none`. Notarization
      # requires a secure timestamp, so a Release build without this is
      # rejected — and the failure surfaces at `notarytool submit`, long
      # after the build looked fine. The embedded `inchill` already asks for
      # one in its post-build signing step; this is the app bundle catching
      # up. Costs a round trip to Apple's timestamp server per Release build.
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
targets:
  InboxAndChill:
    type: application
    platform: macOS
    sources: [Sources/App]
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      - target: inchill
        embed: false
    postBuildScripts:
      - name: Embed inchill CLI
        script: |
          set -e
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/inchill"
          cp "$BUILT_PRODUCTS_DIR/inchill" "$DEST"
          # The embedded CLI must carry the SAME signature as the app around
          # it. A nested ad-hoc binary inside a Developer ID app fails
          # `codesign --verify --deep` and would fail notarization outright.
          # EXPANDED_CODE_SIGN_IDENTITY is the resolved identity hash Xcode
          # is about to sign the app with; fall back to ad-hoc for explicitly
          # unsigned builds.
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}"
          if [ "$IDENTITY" = "-" ]; then
            codesign --force --options runtime --timestamp=none --sign - "$DEST"
          elif [ "$CONFIGURATION" = "Debug" ]; then
            # Skip the timestamp server on dev builds: it's a network round
            # trip per build and only release/notarized builds need it.
            codesign --force --options runtime --timestamp=none --sign "$IDENTITY" "$DEST"
          else
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$DEST"
          fi
        # inputFiles is load-bearing, not documentation: with only outputFiles
        # declared, Xcode treats the script as up to date whenever the output
        # exists and skips it — so a rebuilt CLI never got copied into the app
        # and every `inchill` change silently shipped as the previous build.
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/inchill
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/inchill
      - name: Re-sign Sparkle's nested helpers
        # Sparkle.framework is not one binary: it carries Autoupdate,
        # Updater.app and two XPC services inside it. Xcode's embed step
        # re-signs the framework *bundle* with our Developer ID and leaves
        # all four of those **ad-hoc signed, with no team identifier and no
        # secure timestamp** — verified on a Release build, 2026-08-21.
        #
        # Nothing catches that on the way past. The build succeeds,
        # `codesign --verify --deep --strict` passes (an ad-hoc signature is
        # a valid signature), and the app runs and updates fine locally.
        # Notarization is the first thing that objects, and it objects a long
        # way from the cause — exactly the failure shape that made
        # get-task-allow and the missing timestamp cost real time before.
        #
        # Signed inside-out, because sealing an inner item invalidates every
        # signature wrapped around it. Xcode signs the app bundle itself
        # after this phase, so the outermost seal is still the real one.
        #
        # Entitlements are deliberately dropped: the only one present is
        # ad-hoc signing's placeholder `com.apple.application-identifier`,
        # which asserts an App ID this app does not have and does not need
        # (see the Distribution notes in CLAUDE.md).
        script: |
          set -e
          FRAMEWORK="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          [ -d "$FRAMEWORK" ] || exit 0

          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}"
          # Same reasoning as the inchill step: the timestamp server is a
          # network round trip, so only release builds pay for it.
          if [ "$IDENTITY" = "-" ] || [ "$CONFIGURATION" = "Debug" ]; then
            STAMP="--timestamp=none"
          else
            STAMP="--timestamp"
          fi

          VERSION_DIR="$FRAMEWORK/Versions/Current"
          for NESTED in \
            "$VERSION_DIR/XPCServices/Downloader.xpc" \
            "$VERSION_DIR/XPCServices/Installer.xpc" \
            "$VERSION_DIR/Updater.app" \
            "$VERSION_DIR/Autoupdate" ; do
            [ -e "$NESTED" ] || continue
            codesign --force --options runtime "$STAMP" --sign "$IDENTITY" "$NESTED"
          done
          codesign --force --options runtime "$STAMP" --sign "$IDENTITY" "$FRAMEWORK"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.bgreen.inboxandchill
        PRODUCT_NAME: Inbox & Chill
        PRODUCT_MODULE_NAME: InboxAndChill
        MARKETING_VERSION: "0.3.2"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # The hardened runtime blocks Apple events outright unless the app
        # carries `com.apple.security.automation.apple-events`, and the
        # refusal is errAEEventNotPermitted (-1743) with **no consent
        # prompt** — the app is not permitted even to ask. That is exactly
        # how it failed in 0.3.0: the Apple Mail source polled every 60s,
        # logged -1743 every time, and macOS never offered Privacy &
        # Security → Automation, so there was nothing for the user to allow.
        # The NSAppleEventsUsageDescription above is necessary but not
        # sufficient; it supplies the prompt's wording, this supplies the
        # right to be prompted at all.
        #
        # This does not contradict "Release ships no entitlements": that rule
        # is about `get-task-allow`, which notarization rejects. This is a
        # hardened-runtime resource-access entitlement — no App ID, no
        # provisioning profile, accepted by notarization.
        CODE_SIGN_ENTITLEMENTS: InboxAndChill.entitlements
    # A GENERATED Info.plist, not a hand-maintained one — gitignored exactly
    # like the .xcodeproj, so project.yml stays the single source of truth and
    # `xcodegen generate` is what produces both.
    #
    # Why not GENERATE_INFOPLIST_FILE + INFOPLIST_KEY_* any more: Xcode's
    # INFOPLIST_KEY_<name> mechanism only honours the keys it already knows
    # about. `INFOPLIST_KEY_SUFeedURL` compiled, linked and shipped a bundle
    # with NO SUFeedURL in it, with no warning at any stage — Sparkle would
    # simply have had no feed to read. Verified by reading the built plist,
    # which is the only thing that settles it (CLAUDE.md rule 1).
    info:
      path: InboxAndChill-Info.plist
      properties:
        # XcodeGen's own defaults for these two are the literals "1.0" and
        # "1". Left alone they would silently pin every build to version 1.0,
        # which breaks the About pane, the name notarize.sh gives the dist
        # zip, and — worst — Sparkle's "is this newer?" comparison, so no
        # update would ever be offered.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Inbox & Chill
        LSUIElement: true
        # Xcode injects this only into a plist it generates itself. Sparkle
        # reads it out of the app inside the zip to write the appcast's
        # sparkle:minimumSystemVersion, so a missing value here would offer
        # the update to Macs that cannot run it.
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Focusing the Terminal tab a Claude Code item came from is an
        # AppleEvent to that terminal. Without this string macOS denies the
        # event outright instead of asking — and the denial looks exactly
        # like "nothing happened".
        NSAppleEventsUsageDescription: Inbox & Chill asks your terminal to bring a Claude Code session's window to the front, and asks Mail for the messages you flagged or haven't read.

        # --- Sparkle in-app updates -----------------------------------------
        # The feed must be fetchable with no credentials at all: Sparkle sends
        # no headers and takes no token, for the appcast or for the zip it
        # then downloads. That is the whole reason this repo is public — a
        # private repo's release assets 404 for everyone but a collaborator,
        # so there was nothing for Sparkle to fetch.
        #
        # raw.githubusercontent serves the committed appcast.xml directly, so
        # there is no Pages build to enable and nothing to keep in sync. Its
        # CDN caches for ~5 minutes, which is why a release you just cut is
        # not offered instantly.
        SUFeedURL: https://raw.githubusercontent.com/brandonlucasgreen/inbox-and-chill/main/appcast.xml
        #
        # SUPublicEDKey is deliberately ABSENT until you generate the signing
        # keypair — one command, once, ever:
        #
        #     scripts/sparkle-keys.sh
        #
        # It prints the line to paste right here:
        #
        #     SUPublicEDKey: <44-character base64 key>
        #
        # then run `xcodegen generate`. A placeholder is not used on purpose:
        # Sparkle would accept it, fetch a real update, fail the EdDSA check
        # and report a signature error — which reads like a corrupted download
        # rather than "you never made a key". Absent, the Updates section in
        # Settings names the actual problem instead (rule 5, and see
        # UpdateController.configurationProblem).
  inchill:
    type: tool
    platform: macOS
    sources: [Sources/CLI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.bgreen.inboxandchill.cli
        PRODUCT_NAME: inchill
  InboxAndChillTests:
    type: bundle.unit-test
    platform: macOS
    # ClaudeHook.swift is compiled in directly rather than reached through a
    # target dependency: `inchill` is a command-line tool, so its module
    # can't be imported, and main.swift's top-level code can't be linked into
    # a test bundle. Compiling the one pure, Foundation-only file keeps the
    # hook payload mapping testable (CLAUDE.md rule 6) without giving the CLI
    # a dependency on the app.
    sources: [Tests, Sources/CLI/ClaudeHook.swift]
    dependencies:
      - target: InboxAndChill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.bgreen.inboxandchill.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Inbox & Chill.app/Contents/MacOS/Inbox & Chill"
schemes:
  InboxAndChill:
    build:
      targets:
        InboxAndChill: all
        inchill: all
    test:
      targets: [InboxAndChillTests]
