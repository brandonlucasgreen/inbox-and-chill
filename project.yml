name: InboxAndChill
options:
  bundleIdPrefix: lol.bgreen
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Real Developer ID signing, not ad-hoc ("-"), even for local builds.
    # macOS keys Keychain ACLs, TCC permissions, and firewall decisions to
    # the code signature: an ad-hoc signature has no stable identity, so
    # every rebuild looks like a brand-new app and re-prompts for all of
    # them. Developer ID is also what the eventual release ships with
    # (PLAN §2.1.7), so local testing exercises the real artifact.
    #
    # Building this yourself? Change DEVELOPMENT_TEAM to your own Team ID,
    # or pass CODE_SIGN_IDENTITY="-" to xcodebuild for an unsigned build.
    DEVELOPMENT_TEAM: CV926C8KS8
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
targets:
  InboxAndChill:
    type: application
    platform: macOS
    sources: [Sources/App]
    dependencies:
      - package: KeyboardShortcuts
      - target: inchill
        embed: false
    postBuildScripts:
      - name: Embed inchill CLI
        script: |
          set -e
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/inchill"
          cp "$BUILT_PRODUCTS_DIR/inchill" "$DEST"
          # The embedded CLI must carry the SAME signature as the app around
          # it. A nested ad-hoc binary inside a Developer ID app fails
          # `codesign --verify --deep` and would fail notarization outright.
          # EXPANDED_CODE_SIGN_IDENTITY is the resolved identity hash Xcode
          # is about to sign the app with; fall back to ad-hoc for explicitly
          # unsigned builds.
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}"
          if [ "$IDENTITY" = "-" ]; then
            codesign --force --options runtime --timestamp=none --sign - "$DEST"
          elif [ "$CONFIGURATION" = "Debug" ]; then
            # Skip the timestamp server on dev builds: it's a network round
            # trip per build and only release/notarized builds need it.
            codesign --force --options runtime --timestamp=none --sign "$IDENTITY" "$DEST"
          else
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$DEST"
          fi
        # inputFiles is load-bearing, not documentation: with only outputFiles
        # declared, Xcode treats the script as up to date whenever the output
        # exists and skips it — so a rebuilt CLI never got copied into the app
        # and every `inchill` change silently shipped as the previous build.
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/inchill
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/inchill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.bgreen.inboxandchill
        PRODUCT_NAME: Inbox & Chill
        PRODUCT_MODULE_NAME: InboxAndChill
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: Inbox & Chill
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
  inchill:
    type: tool
    platform: macOS
    sources: [Sources/CLI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.bgreen.inboxandchill.cli
        PRODUCT_NAME: inchill
  InboxAndChillTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: InboxAndChill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.bgreen.inboxandchill.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Inbox & Chill.app/Contents/MacOS/Inbox & Chill"
schemes:
  InboxAndChill:
    build:
      targets:
        InboxAndChill: all
        inchill: all
    test:
      targets: [InboxAndChillTests]
