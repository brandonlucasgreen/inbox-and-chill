# Secret scanning config. Run before publishing anything:
#
#   gitleaks detect --source . --log-opts="--all" --redact
#
# `--log-opts="--all"` is the load-bearing part. Without it only the working
# tree is scanned, and the whole point is the old commits nobody reads.
[extend]
useDefault = true

[[allowlists]]
description = """
Sparkle's update-signing PUBLIC key. Not a secret by design: Sparkle verifies \
downloads against it, so it ships inside every copy of the app's Info.plist and \
comes straight back out with `strings`. The matching PRIVATE key lives only in \
the login keychain and must never be committed — see scripts/sparkle-keys.sh.

Matched on the LINE, with no `paths` filter, and that is deliberate. A global \
allowlist combines `paths` and `regexes` with OR — not AND — so adding \
paths = project.yml exempted the entire file: verified by pasting a fake ghp_ \
token into it and watching the scan come back clean, while the default rules \
caught it. `matchCondition = "AND"` did not change that. So the regex alone \
carries the exemption; it cannot match anything but this key's own line.
"""
regexTarget = "line"
# 32 raw bytes -> 43 base64 characters plus one '=' of padding, so 44 total.
regexes = ['''SUPublicEDKey:\s*[A-Za-z0-9+/]{43}=''']
