name: Secret scan

# The app stores Slack, Linear, GitHub, ntfy and Sentry tokens in the user's
# Keychain, and this repo's own history has already had two credential-shaped
# test fixtures in it. A token committed by accident is not something a build
# failure or a test would ever notice, so it gets its own check.
on:
  pull_request:
  push:
    branches: [main]
  # Weekly, because the rules gitleaks ships get better over time: a scan that
  # was clean in March can find something in June without a single new commit.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 is load-bearing, not thoroughness. The whole point of
      # this scan is the old commits nobody reads; a shallow clone has none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installed straight from the project's own releases rather than through
      # a third-party action, so nothing but gitleaks itself runs here.
      #
      # Deliberately tracking the latest release instead of pinning a version.
      # For a scanner, "the newest rules" is the point — a pinned old version
      # quietly stops finding new classes of token, which is the silent
      # failure this whole check exists to prevent. The blast radius is small:
      # the job holds no secrets and has read-only access.
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(curl -sSfL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -o 'https://[^"]*linux_x64\.tar\.gz' | head -1)
          if [ -z "$URL" ]; then
            echo "Could not resolve a gitleaks download URL." >&2
            echo "This check has NOT run — treat it as a failure, not a pass." >&2
            exit 1
          fi
          echo "Downloading $URL"
          curl -sSfL "$URL" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # --log-opts="--all" scans every commit on every ref, not just the
      # working tree, which is gitleaks' default and the reason a scan can
      # come back clean while a token sits in history.
      #
      # --redact keeps any finding out of the log. The point is to be told
      # something leaked, not to publish it a second time in the CI output.
      #
      # .gitleaks.toml carries the repo's two documented exemptions and the
      # reasoning for each; it is picked up automatically from the repo root.
      - name: Scan full history
        run: gitleaks detect --source . --log-opts="--all" --redact --verbose

      - name: What to do if this failed
        if: failure()
        run: |
          cat >&2 <<'EOF'
          A secret was found. In order:

            1. ROTATE IT. Assume it is compromised the moment it is pushed —
               GitHub keeps old objects reachable by SHA even after a
               force-push, so rewriting history buys obscurity, not deletion.
            2. Replace the value in the working tree with a plainly fake one.
            3. If it was never a real credential (a synthetic test fixture),
               add a commit-scoped entry to .gitleaks.toml explaining why,
               following the two that are already there.

          Rotation is the real fix. Everything else is bookkeeping.
          EOF
